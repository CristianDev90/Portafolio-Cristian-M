<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Sample online store project image placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1424"/>
      <stop offset="1" stop-color="#070d18"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#4c9aff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4c9aff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#1b2b43" stroke-width="1" stroke-opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>
  <rect width="1200" height="750" fill="url(#glow)"/>

  <text x="64" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="6" fill="#e9eff8">ONLINE STORE</text>
  <text x="66" y="126" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="4" fill="#4c9aff">SAMPLE CATALOG</text>

  <!-- Browser window -->
  <rect x="200" y="150" width="800" height="500" rx="18" fill="#0d1828" stroke="#2a3f5e" stroke-width="2"/>
  <path d="M200 198h800" stroke="#1b2b43" stroke-width="2"/>
  <circle cx="232" cy="174" r="6" fill="#35506f"/>
  <circle cx="252" cy="174" r="6" fill="#35506f"/>
  <circle cx="272" cy="174" r="6" fill="#35506f"/>
  <rect x="306" y="164" width="330" height="20" rx="10" fill="#0f1722"/>

  <!-- Store header -->
  <rect x="230" y="226" width="120" height="14" rx="7" fill="#4c9aff" opacity="0.85"/>
  <g fill="#2a3f5e">
    <rect x="720" y="226" width="48" height="10" rx="5"/>
    <rect x="788" y="226" width="48" height="10" rx="5"/>
    <rect x="856" y="226" width="48" height="10" rx="5"/>
  </g>
  <circle cx="938" cy="231" r="12" fill="#122036" stroke="#2a3f5e"/>

  <!-- Hero strip -->
  <rect x="230" y="266" width="740" height="120" rx="14" fill="#122036" stroke="#1b2b43"/>
  <rect x="258" y="294" width="180" height="16" rx="8" fill="#e9eff8" opacity="0.75"/>
  <rect x="258" y="322" width="130" height="9" rx="4.5" fill="#35506f"/>
  <rect x="258" y="340" width="150" height="9" rx="4.5" fill="#2a3f5e"/>
  <rect x="258" y="364" width="96" height="26" rx="13" fill="#1a6fe0"/>
  <rect x="700" y="286" width="240" height="80" rx="10" fill="#4c9aff" opacity="0.12"/>

  <!-- Product cards -->
  <g fill="#122036" stroke="#1b2b43">
    <rect x="230" y="410" width="168" height="210" rx="12"/>
    <rect x="422" y="410" width="168" height="210" rx="12"/>
    <rect x="614" y="410" width="168" height="210" rx="12"/>
    <rect x="806" y="410" width="164" height="210" rx="12"/>
  </g>
  <g fill="#4c9aff" opacity="0.14">
    <rect x="242" y="422" width="144" height="110" rx="8"/>
    <rect x="434" y="422" width="144" height="110" rx="8"/>
    <rect x="626" y="422" width="144" height="110" rx="8"/>
    <rect x="818" y="422" width="140" height="110" rx="8"/>
  </g>
  <g fill="#35506f">
    <rect x="242" y="548" width="100" height="9" rx="4.5"/>
    <rect x="434" y="548" width="88" height="9" rx="4.5"/>
    <rect x="626" y="548" width="104" height="9" rx="4.5"/>
    <rect x="818" y="548" width="92" height="9" rx="4.5"/>
  </g>
  <g fill="#2a3f5e">
    <rect x="242" y="568" width="64" height="7" rx="3.5"/>
    <rect x="434" y="568" width="56" height="7" rx="3.5"/>
    <rect x="626" y="568" width="70" height="7" rx="3.5"/>
    <rect x="818" y="568" width="60" height="7" rx="3.5"/>
  </g>
  <g fill="#4c9aff" opacity="0.75">
    <rect x="242" y="592" width="52" height="10" rx="5"/>
    <rect x="434" y="592" width="52" height="10" rx="5"/>
    <rect x="626" y="592" width="52" height="10" rx="5"/>
    <rect x="818" y="592" width="52" height="10" rx="5"/>
  </g>

  <text x="1136" y="710" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="14" letter-spacing="2" fill="#7f93ad">IMAGE PLACEHOLDER</text>
</svg>
